name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The gitleaks CLI, not gitleaks/gitleaks-action. The action requires a
      # paid license key for repositories owned by an organization and exits
      # before scanning without one, so this job failed in ten seconds on
      # every run and never scanned anything. The CLI is the same engine and
      # needs no license. Pinned by version and by checksum.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Whole history on every run: about 15 seconds at this size. Findings
      # that were reviewed and are not secrets are listed by fingerprint in
      # .gitleaksignore; anything new fails the job.
      - name: Scan the full history
        run: gitleaks git . --redact --no-banner --verbose
