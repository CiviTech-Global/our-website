name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Production deploys are started by hand (Actions -> CI -> Run workflow, on
  # main). A push to main builds, scans and publishes images but never
  # deploys: releases are batched, and a module can sit on main for days
  # before it goes live.
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  server:
    name: Server (audit, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civitech
          POSTGRES_PASSWORD: civitech
          POSTGRES_DB: civitechglobal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civitech -d civitechglobal"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: civitechglobal-server/package-lock.json

      - name: Install server dependencies
        working-directory: civitechglobal-server
        run: npm ci

      - name: Audit dependencies
        working-directory: civitechglobal-server
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint:server

      - name: Typecheck
        working-directory: civitechglobal-server
        run: npx tsc -p tsconfig.json --noEmit

      - name: Prepare test environment
        # config/env.ts validates required variables at import time; the test
        # suites run against the postgres/redis service containers above.
        working-directory: civitechglobal-server
        run: cp .env.example .env

      - name: Apply the schema
        working-directory: civitechglobal-server
        run: npx prisma migrate deploy

      - name: Test
        run: npm run test:server

      - name: Build
        run: npm run build:server

  web:
    name: Web (audit, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: civitechglobal-web/package-lock.json

      - name: Install web dependencies
        working-directory: civitechglobal-web
        run: npm ci

      - name: Audit dependencies
        working-directory: civitechglobal-web
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint:web

      - name: Typecheck
        working-directory: civitechglobal-web
        run: npx tsc -b --noEmit

      - name: Test
        run: npm run test:web

      - name: Build
        run: npm run build:web

  docker:
    name: Docker (build + scan${{ github.ref == 'refs/heads/main' && ' + push' || '' }})
    needs: [server, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./civitechglobal-server
            dockerfile: Dockerfile
            image: civitechglobal-api
          - name: web
            context: ./civitechglobal-web
            dockerfile: Dockerfile
            image: civitechglobal-web
            # Vite inlines VITE_* at build time and .dockerignore keeps .env out
            # of the image, so the bundle only learns its canonical origin from
            # a build arg. Without it the app falls back to the visitor's own
            # origin — and the apex and the www alias would then each claim to
            # be canonical, which is the duplicate-content problem the tag is
            # meant to settle.
            build_args: |
              VITE_CANONICAL_ORIGIN=https://rayantamaddonjahangostar.ir
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up lint environment
        # A venv (not pipx): the lint run must see the same collections the
        # playbooks require, so ansible and ansible-lint share one env.
        run: |
          python3 -m venv /tmp/lintenv
          /tmp/lintenv/bin/pip install --quiet ansible ansible-lint
      - name: Install required collections
        run: /tmp/lintenv/bin/ansible-galaxy collection install -r civitech-deploy/requirements.yml
      - name: Lint
        run: /tmp/lintenv/bin/ansible-lint civitech-deploy/

  deploy:
    name: Deploy to production
    needs: [docker]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production      # add required reviewers in repo settings
      url: https://rayantamaddonjahangostar.ir
    steps:
      - uses: actions/checkout@v7

      - name: Install Ansible
        run: pipx install --include-deps ansible

      - name: Restore the SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Render the inventory
        # inventory.ini is gitignored, so CI renders it from secrets. It must
        # match the hand-kept one: domain_name is baked into CORS_ORIGIN and
        # APP_URL, so the bare IP here would ship an API that rejects its own
        # front end. certbot_email is left out because only nginx.yml uses it.
        working-directory: civitech-deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          cat > inventory.ini <<EOF
          [civitech_prod]
          civitech-prod ansible_host=${DEPLOY_HOST} ansible_user=root

          [civitech_prod:vars]
          domain_name=rayantamaddonjahangostar.ir
          domain_alias=www.rayantamaddonjahangostar.ir

          ansible_ssh_private_key_file=~/.ssh/id_ed25519
          ansible_python_interpreter=/usr/bin/python3

          [semaphore]
          civitech-prod ansible_host=${DEPLOY_HOST} ansible_user=root
          EOF

      - name: Deploy this exact commit
        working-directory: civitech-deploy
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/civitech-deploy/ansible.cfg
        run: |
          ansible-galaxy collection install -r requirements.yml
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vp
          chmod 600 /tmp/vp
          trap 'rm -f /tmp/vp' EXIT
          ansible-playbook deploy.yml \
            -e app_version=${{ github.sha }} \
            --vault-password-file /tmp/vp
