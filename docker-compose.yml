services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civitech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civitech}
      POSTGRES_DB: ${POSTGRES_DB:-civitechglobal}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civitech}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./civitechglobal-server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./civitechglobal-server/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civitech}:${POSTGRES_PASSWORD:-civitech}@postgres:5432/${POSTGRES_DB:-civitechglobal}
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build:
      context: ./civitechglobal-server
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file:
      - ./civitechglobal-server/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civitech}:${POSTGRES_PASSWORD:-civitech}@postgres:5432/${POSTGRES_DB:-civitechglobal}
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./civitechglobal-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  # Runs scripts/backup-postgres.sh on a daily loop and prunes dumps older
  # than BACKUP_RETENTION_DAYS. See civitechglobal-server/scripts/backup-loop.sh.
  # This is a self-host-friendly baseline — if you deploy behind a managed
  # Postgres provider (RDS/Cloud SQL/etc.), prefer that provider's native
  # automated backups instead and remove this service.
  backup:
    build:
      context: ./civitechglobal-server
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-civitech}:${POSTGRES_PASSWORD:-civitech}@postgres:5432/${POSTGRES_DB:-civitechglobal}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_backups:
