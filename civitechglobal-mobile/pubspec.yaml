name: civitech_global_flutter
description: "CiviTech Global mobile app for Android and iOS."
# A private app: never published to pub.dev.
publish_to: 'none'

# version: <name>+<build>. The build number must rise with every store upload.
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  animations: ^2.2.0
  cached_network_image: ^3.4.1
  dio: ^5.11.1
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  json_annotation: ^4.9.0
  package_info_plus: ^10.2.2
  shamsi_date: ^1.1.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  file_picker: ^13.1.0
  persian_datetime_picker: ^3.2.0
  cross_file: ^0.3.5+5
  cupertino_icons: ^1.0.9
  intl: ^0.20.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device performance runs (test_driver/). flutter_driver rather than
  # integration_test: the latter needs androidx test libraries from Google's
  # Maven, which this build machine cannot reach.
  flutter_driver:
    sdk: flutter

  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  test: ^1.26.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/l10n/
    - assets/help/
    - assets/blog/
    - assets/geo/
  fonts:
    # Vazirmatn, the web's face (OFL; licence beside the file). Variable, so
    # every weight from 100 to 900 comes from this one file through FontVariation.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Variable.ttf
