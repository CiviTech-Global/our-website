# Static analysis for the mobile app. `flutter analyze` runs it, and so do CI
# and the pre-commit hook, so a warning here stops a commit rather than piling
# up.
#
# Starts from Flutter's recommended set and tightens what costs nothing on an
# empty project and a great deal to retrofit: implicit dynamic, unawaited
# futures and loose typing are exactly where API-driven code goes wrong
# quietly.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A missing await on a request or a storage write is a real bug, not style.
    unawaited_futures: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_build_context_synchronously
    - use_super_parameters
