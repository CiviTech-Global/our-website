<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />

    <!--
      ENAMAD (اینماد) ownership check. The panel reads this tag from the home
      page and the matching empty file at /1797796.txt from the web root;
      both have to stay put for the trust seal to keep verifying.
    -->
    <meta name="enamad" content="1797796" />

    <!--
      The description below is what a search result and a shared link show. It
      describes the software company, which is the business; insurance is one
      service among several and no longer leads.

      Per-page titles are set at runtime by useDocumentTitle — this one is the
      fallback shown before React mounts, and to any crawler that does not run
      scripts.

      Every tag below carries data-head, which is the marker the head manager
      owns: it clears that set and writes its own on mount. So these are the
      pre-render fallback, and never a second description left competing with
      the real one once the app is running.
    -->
    <title>رایان تمدن جهان گستر</title>
    <meta
      data-head
      name="description"
      content="رایان تمدن جهان گستر — شرکت مهندسی نرم‌افزار: طراحی و توسعهٔ نرم‌افزار سفارشی، پلتفرم‌های سازمانی و پروژه‌های متن‌باز."
    />
    <meta data-head name="author" content="رایان تمدن جهان گستر (Rayan Tamaddon Jahan Gostar)" />

    <meta data-head property="og:type" content="website" />
    <meta data-head property="og:site_name" content="رایان تمدن جهان گستر" />
    <meta data-head property="og:title" content="رایان تمدن جهان گستر | Rayan Tamaddon Jahan Gostar" />
    <meta
      data-head
      property="og:description"
      content="شرکت مهندسی نرم‌افزار: طراحی و توسعهٔ نرم‌افزار سفارشی، پلتفرم‌های سازمانی و پروژه‌های متن‌باز."
    />
    <!--
      The static fallback for crawlers that do not run scripts. Every page
      overrides these at runtime through useDocumentTitle; the runtime value
      is what a JavaScript-capable crawler and every link preview reads. This
      pair only has to be a branded 1200x630 card instead of the favicon.
    -->
    <meta data-head property="og:image" content="https://rayantamaddonjahangostar.ir/og/default.png" />
    <meta data-head property="og:image:width" content="1200" />
    <meta data-head property="og:image:height" content="630" />
    <meta data-head property="og:locale" content="fa_IR" />
    <meta data-head property="og:locale:alternate" content="en_US" />
    <meta data-head name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      ENAMAD (اینماد) trust seal. Sits in the document rather than inside the
      React tree so it is the last thing on the page and is present in the
      served HTML, and is reproduced exactly as issued: the seal is a state
      mark and altering it is an offence, not a style choice.
    -->
    <div id="enamad-seal" style="display:flex;justify-content:center;padding:16px">
      <a referrerpolicy='origin' target='_blank' href='https://trustseal.enamad.ir/?id=7802250&Code=H3YASD8X7ByfZyyLN4APTEuaxxzYPeCw'><img referrerpolicy='origin' src='https://trustseal.enamad.ir/logo.aspx?id=7802250&Code=H3YASD8X7ByfZyyLN4APTEuaxxzYPeCw' alt='' style='cursor:pointer' code='H3YASD8X7ByfZyyLN4APTEuaxxzYPeCw'></a>
    </div>
  </body>
</html>
