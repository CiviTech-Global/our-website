# The www alias exists for two reasons: Google Search Console verifies the
# property https://www.rayantamaddonjahangostar.ir/ by fetching a file at the
# exact www address, so the file must answer there (a redirect before the file
# is fetched fails verification). Everything else on www is a permanent
# redirect to the apex — the site's canonical origin is the bare domain
# (VITE_CANONICAL_ORIGIN), and serving the same pages on both hosts is the
# duplicate-content state the canonical tag exists to settle.
server {
    listen 80;
    server_name www.rayantamaddonjahangostar.ir;
    root /usr/share/nginx/html;

    # Search Console ownership verification. Served as-is, never redirected,
    # never compressed-dependent: the token is the entire body.
    location = /googleffb0574ff6303897.html {
        default_type text/html;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        return 301 https://rayantamaddonjahangostar.ir$request_uri;
    }
}

server {
    # default_server, and not merely first-in-file: nginx sends any request
    # whose Host matches no server_name to the default server, and picks the
    # first block for that port when nothing claims the role. `server_name _`
    # is not a wildcard — it is a name that can never match — so once the www
    # redirect block was added above, every apex request fell through to it
    # and was redirected to itself. The site answered 301 to everything.
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prefer the .gz written at build time (scripts/precompress.mjs) over
    # compressing on the fly: it is level 9 rather than level 5, and it costs
    # no CPU per request.
    gzip_static on;

    # Fallback for anything not precompressed — the API proxy below, mostly.
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml text/xml application/manifest+json;
    gzip_min_length 1024;
    gzip_vary on;

    # The build also emits .br, which is about 13% smaller again. Stock nginx
    # cannot serve it — brotli_static needs a module that is not in this base
    # image — so those files sit unused until a CDN or a brotli-capable proxy
    # is in front, at which point they are already there.

    # Security headers applied to every response served by this server block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://trustseal.enamad.ir; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Proxy API calls to the backend "api" service (see docker-compose.yml).
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # The dynamic sitemap: insurance products and open marketplace listings,
    # generated by the API from the database. A short cache keeps the XML from
    # being rebuilt per crawl; robots.txt names this alongside the static one.
    location = /sitemap-extras.xml {
        proxy_pass http://api:5000/api/sitemap/extras.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed filenames, so the content can never change under a given URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Different bytes per encoding; without this a shared cache can hand a
        # gzip body to a client that did not ask for one.
        add_header Vary "Accept-Encoding";
    }

    # RFC 9116 disclosure route. Plain text, and worth a short cache rather
    # than a revalidation on every crawl.
    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
    }

    # Never let a CDN or browser cache serve a stale app shell after a deploy.
    # Note: an add_header in a location block does NOT inherit add_header
    # directives from the server block in nginx, so the security headers
    # above are repeated here to keep applying to index.html responses.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://trustseal.enamad.ir; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Never rewrite a visitor's URL to add a trailing slash. nginx is behind a
    # TLS-terminating proxy, so it builds absolute redirects from its own
    # plain-HTTP listener and sends people to http:// — and the prerendered
    # pages are directories, so the default behaviour turned every route into
    # a redirect to its own slashed form over HTTP.
    absolute_redirect off;

    # SPA fallback, serving prerendered HTML where it exists.
    #
    # `$uri/index.html` rather than `$uri/`: the second asks nginx to serve a
    # directory, which it answers with a 301 to the slashed URL before serving
    # anything. That contradicts the canonical tags and the sitemap, which
    # name these routes without a trailing slash, and costs a round trip on
    # every page. Naming the index file serves it directly at the URL asked
    # for. Anything with no prerendered file still falls through to the shell
    # and is routed in the browser.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
