# Copy to inventory.ini and fill in the REPLACE_ME values.
# inventory.ini is gitignored so the server IP and SSH user never land in
# source control.
#
#   cp inventory.example.ini inventory.ini
#
# Every value below is a placeholder. The playbooks assert on them and refuse
# to run until they are replaced.

[civitech_prod]
civitech-prod ansible_host=REPLACE_ME_SERVER_IP ansible_user=root

[civitech_prod:vars]
# Public domain that resolves to ansible_host. Used for the nginx server_name,
# the Let's Encrypt certificate and CORS_ORIGIN.
domain_name=REPLACE_ME_DOMAIN            ; e.g. civitechglobal.com
# The www alias if you own it; leave empty otherwise.
domain_alias=
# Address Let's Encrypt uses for expiry warnings.
certbot_email=REPLACE_ME_EMAIL

# Use the key bootstrap.yml installed. Password auth is for bootstrap.yml
# only — roles/common turns it off.
ansible_ssh_private_key_file=~/.ssh/civitech_ed25519

# Semaphore UI can live on the same box (fine for one deployment) or on a
# separate control host. Point this group at whichever you chose.
[semaphore]
civitech-prod ansible_host=REPLACE_ME_SERVER_IP ansible_user=root
