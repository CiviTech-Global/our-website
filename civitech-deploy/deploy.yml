---
# Build and release the application. Safe to run repeatedly.
#
#   ansible-playbook deploy.yml -e app_version=<git sha> \
#     --vault-password-file ~/.civitech-vault-pass
#
# Find the SHA under Packages on the GitHub repo, or from the CI run for the
# commit — .github/workflows/ci.yml pushes ghcr.io/<owner>/civitechglobal-*
# tagged with both `latest` and the commit SHA once lint, typecheck, tests,
# build and a Trivy scan at CRITICAL/HIGH have all passed.
#
# See what would change without touching the server:
#   ansible-playbook deploy.yml --check --diff

- name: Deploy CiviTech Global
  hosts: civitech_prod
  become: true
  # One host at a time. With a second server this is what keeps the other one
  # serving while this one restarts.
  serial: 1

  pre_tasks:
    - name: Refuse to deploy with placeholder secrets
      # A shipped placeholder JWT secret means anyone who reads this
      # repository can mint an admin token. The server's config/env.ts already
      # throws on a short secret at startup; failing here means it never gets
      # that far, and the running release keeps serving.
      ansible.builtin.assert:
        that:
          - vault_jwt_secret is defined
          - not (vault_jwt_secret | string).startswith('REPLACE_ME')
          - (vault_jwt_secret | length) >= 32
          - vault_jwt_refresh_secret is defined
          - not (vault_jwt_refresh_secret | string).startswith('REPLACE_ME')
          - (vault_jwt_refresh_secret | length) >= 32
          # Two token types signed with one secret means a stolen 15-minute
          # access token can be replayed as a 7-day refresh token.
          - vault_jwt_refresh_secret != vault_jwt_secret
          - vault_postgres_password is defined
          - not (vault_postgres_password | string).startswith('REPLACE_ME')
        fail_msg: >-
          group_vars/all/vault.yml still contains template values, or the two
          JWT secrets are identical. Generate real ones:
          openssl rand -hex 32
      no_log: true

    - name: Refuse to deploy without a working SMS gateway
      # Phone verification gates every insurance request. With the console
      # provider the API refuses to start in production — but a missing API key
      # or template would let it start and then fail on the first applicant,
      # silently, one send at a time. Catch both here instead.
      ansible.builtin.assert:
        that:
          - sms_provider in ['kavenegar', 'smsir']
          - vault_sms_api_key is defined
          - (vault_sms_api_key | length) > 0
          - not (vault_sms_api_key | string).startswith('REPLACE_ME')
          - vault_sms_otp_template is defined
          - (vault_sms_otp_template | length) > 0
          - not (vault_sms_otp_template | string).startswith('REPLACE_ME')
        fail_msg: >-
          Insurance requests verify the applicant's phone by SMS. Set
          sms_provider to kavenegar or smsir in group_vars/all/main.yml, and
          put the gateway credentials in vault.yml. Deploying without them
          leaves every applicant unable to submit.
      no_log: true

    - name: Refuse to deploy an unpinned build
      # `latest` deploys whatever CI pushed most recently, which makes
      # rollback impossible and "which commit is live" unanswerable. Override
      # with -e allow_latest=true only when you genuinely mean it.
      ansible.builtin.assert:
        that:
          - app_version != 'latest'
        fail_msg: >-
          Pass an immutable tag: -e app_version=<git sha>. Find it under
          Packages on the GitHub repo, or from the CI run for that commit.
      when: not (allow_latest | default(false) | bool)

    - name: Refuse to deploy with an unconfigured domain
      ansible.builtin.assert:
        that:
          - domain_name is defined
          - not (domain_name | string).startswith('REPLACE_ME')
        fail_msg: >-
          domain_name is still a placeholder. Set it in inventory.ini — it is
          baked into CORS_ORIGIN and into the certificate, so a wrong value
          here means an API that rejects its own front end.

    - name: Look for an existing database volume
      # The question this answers is "is there data to lose", and the only
      # honest signal is the volume itself.
      #
      # This used to stat {{ app_root }}/docker-compose.yml, which is wrong in
      # a way that only shows up after a failed deploy: the compose files are
      # written before anything starts, so a run that died at the image pull
      # left them behind with no database ever created. The next deploy then
      # saw "already deployed", tried to dump, and failed with "postgres is
      # not accepting connections" — blocking a first deploy on the safety net
      # for data that does not exist.
      ansible.builtin.command:
        cmd: docker volume ls --quiet --filter name=_postgres_data
      register: postgres_volume
      changed_when: false

    - name: Start postgres so it can be dumped
      # The volume can outlive the container — after a crash, or a
      # `docker compose down`. There IS data to protect in that case, so the
      # right move is to bring the database up and take the dump, not to skip
      # it silently.
      ansible.builtin.command:
        cmd: >-
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          up -d postgres
        chdir: "{{ app_root }}"
      changed_when: true
      when:
        - postgres_volume.stdout | length > 0
        - app_pre_deploy_backup | default(true) | bool

    - name: Wait for postgres to accept connections
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres pg_isready -U {{ postgres_user }}
        chdir: "{{ app_root }}"
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false
      when:
        - postgres_volume.stdout | length > 0
        - app_pre_deploy_backup | default(true) | bool

    - name: Back up before migrating
      # Prisma migrations are forward-only — there is no `migrate down`.
      # rollback.yml can put the old image back, but nothing can put the data
      # back except this dump. Skipped only when there is genuinely no
      # database yet.
      ansible.builtin.command:
        cmd: /usr/local/bin/civitech-backup.sh
      changed_when: true
      when:
        - postgres_volume.stdout | length > 0
        - app_pre_deploy_backup | default(true) | bool

  roles:
    - app
