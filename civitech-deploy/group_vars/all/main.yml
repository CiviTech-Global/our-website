---
# ============================================================================
# Non-secret configuration shared by every host in the [civitech_prod] group.
# Secrets live in vault.yml (Ansible Vault) — see vault.example.yml.
#
# Variables here outrank variables written into inventory.ini, so anything
# with an entry below must be changed HERE. domain_name, domain_alias and
# certbot_email deliberately have no entry, which makes the inventory the
# right place for those.
# ============================================================================

# ---- Where the stack lives -------------------------------------------------
app_name: civitech
app_root: /opt/civitech
app_user: civitech
app_group: civitech

# ---- Images ----------------------------------------------------------------
# .github/workflows/ci.yml lints, typechecks, tests, builds, scans with Trivy
# at CRITICAL/HIGH, and pushes two images to GHCR tagged with both `latest`
# and the commit SHA. We deploy those, rather than building on the server:
#
#   - the server never needs the ~1.5 GB a Vite build peaks at
#   - a deploy is a pull, not a build
#   - rollback is one variable
#   - what ships is exactly what CI tested and Trivy scanned
#
# Deploy a SHA, never `latest`. deploy.yml refuses `latest` unless you pass
# -e allow_latest=true, because an unpinned tag makes rollback impossible and
# "which commit is live" unanswerable.
#
#   ansible-playbook deploy.yml -e app_version=<git sha>
# Set false to deploy images that are already present on the host — a
# locally-built first release, a registry outage, or an air-gapped install.
# The default is true because a deploy that silently runs a stale image is
# far worse than one that fails loudly on a missing tag.
pull_images: true

# The seed is idempotent — it creates the SUPER_ADMIN when there is none and
# otherwise resets that account to the vault's credentials. Running it on every
# deploy is what makes a forgotten admin password recoverable. Set false only
# if you deliberately want the live admin credentials to diverge from vault.
app_seed_on_deploy: true

registry: ghcr.io
registry_owner: civitech-global
app_version: latest
image_api: "{{ registry }}/{{ registry_owner }}/civitechglobal-api:{{ app_version }}"
image_web: "{{ registry }}/{{ registry_owner }}/civitechglobal-web:{{ app_version }}"
# Only needed while the GHCR packages are private. The token is in vault.
ghcr_username: ""

# ---- Ports -----------------------------------------------------------------
# Every application port binds to loopback; nginx is the only public listener.
# docker-compose.yml already binds these to 127.0.0.1 — the prod override
# rendered by roles/app restates it so the two cannot drift apart.
api_port: 5000
web_port: 8080

# ---- Application environment ----------------------------------------------
node_env: production
log_level: info
postgres_user: civitech
postgres_db: civitechglobal
# Prisma reads pool settings straight off the connection string. Its default
# is cores*2+1 PER PROCESS, so this bound matters the moment there is more
# than one API container.
db_connection_limit: 10
db_pool_timeout: 20

# Which role the API connects as.
#
# Migrations always run as {{ postgres_user }}, because they need to own the
# schema. The application does not: the 20260910180000 migration creates
# civitech_app with DML only — no DDL, no TRUNCATE, no ownership, and no
# ability to disable row-level security.
#
# Leave this false for the first deploy after that migration, confirm the
# api container is healthy, then set it true and deploy again. Splitting the
# cutover from the migration means a privilege mistake shows up as one failed
# deploy you can roll back, not as a migration you cannot.
db_use_least_privilege_role: false
db_app_user: civitech_app

# NOTE: there is no Telegram bot in this deployment. The company offers
# nothing Telegram-based, so the bot is not built by CI, not defined in the
# compose files and not started here. Its source remains in the repository
# under civitechglobal-server/src/bot/ — see the note in docker-compose.yml.

# ---- Phone verification (insurance requests) -------------------------------
# Website submissions are open to anyone, so the phone number is proved by a
# one-time code before the request is accepted: it is the number a specialist
# rings back, and an unverified public form fills the queue with typos.
#
# "kavenegar" or "smsir" in production. "console" logs the code instead of
# sending it and is refused at startup when NODE_ENV=production — deploy.yml
# asserts the same thing so the failure surfaces before the container starts.
sms_provider: kavenegar

otp_ttl_seconds: 300
# Per-number cooldown. The API also rate-limits per caller; this bounds many
# sources hitting one number, that bounds one source hitting many numbers.
otp_resend_cooldown_seconds: 60
otp_max_attempts: 5
# How long a verified-phone token stays usable to submit the form behind it.
phone_token_ttl_seconds: 900

# ---- nginx / TLS -----------------------------------------------------------
# Set to false for the first run if DNS has not propagated: Let's Encrypt
# cannot issue a certificate for a bare IP, and certbot fails when the domain
# does not resolve to this server. Re-run nginx.yml without the flag after DNS
# is live.
# Currently FALSE: the site answers on http://62.220.123.6 because there is
# no domain yet, and Let's Encrypt cannot issue for a bare IP address. Set
# this to true once domain_name in inventory.ini is a hostname that resolves
# here, then re-run nginx.yml.
#
# The web bundle does NOT need rebuilding when the domain changes: it reads
# `import.meta.env.VITE_API_URL ?? '/api'`, which is origin-relative, so the
# same image serves correctly from any hostname.
enable_ssl: false
# Must be >= the API's express.json limit of 1mb, or nginx rejects a legal
# request with a 413 before Node ever sees it.
nginx_client_max_body_size: 2M

# Names this site answers to beyond domain_name and domain_alias. The bare IP
# stays here so the address the site launched on keeps working after the domain
# is attached — an old bookmark should not 404.
# Derived once rather than repeated: http and https are different ORIGINS to a
# browser, so anywhere the site states its own address has to agree with
# whether TLS is on.
scheme: "{{ 'https' if enable_ssl | bool else 'http' }}"

nginx_extra_server_names:
  - 62.220.123.6
  # Listed before DNS resolves on purpose. nginx answers to them and the API
  # accepts them as origins the moment the name starts pointing here, so the
  # site is fully working — login included — without waiting on another
  # deploy. They move to domain_name/domain_alias at the TLS cutover.
  - rayantamaddonjahangostar.ir
  - www.rayantamaddonjahangostar.ir

# CIDRs of anything that proxies traffic to this server — a CDN's edge nodes.
# EMPTY MEANS NGINX IS THE FIRST HOP, which is the safe default: an
# X-Forwarded-For from an untrusted source is ignored, so nobody can spoof
# their address past the rate limiter.
#
# Fill this in when a CDN is put in front, and ONLY with ranges the provider
# publishes. Getting it wrong in the permissive direction (0.0.0.0/0) would let
# any caller claim any address; getting it wrong in the other direction just
# means the limiter counts the CDN as one client, which is what it does today.
nginx_trusted_proxies: []

# Edge rate limits. The application's own limiter is Redis-backed and correct,
# but every request it rejects has already been accepted, parsed, run through
# optionalAuth (a database read whenever a token is present) and round-tripped
# to Redis. nginx drops a flood before any of that happens.
nginx_api_rate: 20r/s
nginx_auth_rate: 1r/s
nginx_api_burst: 40
nginx_auth_burst: 5

# ---- Uploaded file storage --------------------------------------------------
#
# "local" keeps client attachments and CVs on the named `uploads` docker volume
# and includes them in the nightly backup. It is durable, but it is on the same
# disk as everything else and only one API container can see it.
#
# Switch to "s3" once object storage exists — any S3-compatible provider works
# (ArvanCloud, MinIO, Backblaze, AWS). That is also the prerequisite for running
# more than one API container, since two cannot share a volume.
storage_driver: local
storage_endpoint: ""
storage_bucket: ""
storage_region: us-east-1
# Credentials belong in vault.yml as vault_storage_access_key / _secret_key.

# ---- Email -------------------------------------------------------------------
#
# Password reset and address verification. config/env.ts refuses to start on
# EMAIL_PROVIDER=console in production, for the same reason it refuses a console
# SMS provider: links logged to stdout are live credentials sitting in a log.
email_provider: resend
email_from: no-reply@{{ domain_name }}
email_domain: ""

# ---- Malware scanning --------------------------------------------------------
#
# "none" accepts uploads unscanned; "clamav" streams each one to a clamd
# container before it is stored. clamav costs roughly 1 GB of RAM for its
# signature database, so on a 2 GB host it is a real decision rather than a
# free win — which is why it is off until somebody chooses it, and why the API
# makes you say so explicitly in production.
#
# Turning it on also means starting the container:
#   docker compose --profile scanning up -d clamav
malware_scanner: none

# ---- Backups ---------------------------------------------------------------
backup_dir: /var/backups/civitech
backup_retention_days: 14
backup_cron_hour: 3
backup_cron_minute: 30

# Restore drill: weekly, restores the newest dump into a scratch database and
# asserts it contains tables and rows.
#
# A dump nobody has ever read back is a hypothesis, not a backup. This is the
# cheapest way to keep it a fact, and it fails loudly through the same alert
# path as the health check.
restore_drill_enabled: true
restore_drill_weekday: Sun
restore_drill_hour: 5
# rclone remote for the off-host copy, e.g. "civitech-backups:civitech".
#
# EMPTY MEANS BACKUPS LIVE ON THE MACHINE THEY PROTECT. A host loss, a disk
# loss or a stray `docker volume prune` takes the database and all
# {{ backup_retention_days }} days of its dumps together. roles/backup prints
# a loud warning while this is unset, and so does the backup container on
# every cycle.
backup_remote: ""
# Path to an rclone config on the CONTROL machine, copied to the server when
# backup_remote is set. Contains cloud credentials, so it is copied 0600 and
# never committed.
rclone_config_src: "~/.config/rclone/rclone.conf"

# ---- Firewall / SSH --------------------------------------------------------
firewall_enabled: true
firewall_allowed_tcp_ports: [22, 80, 443]

ssh_hardening_enabled: true
# Key-only. Run bootstrap.yml FIRST — it installs your key and proves key auth
# works before this setting can lock you out. Setting this true is a decision
# to accept every bot on the internet trying root over port 22; fail2ban below
# is the compensating control if you make it.
ssh_permit_password_auth: false
ssh_max_auth_tries: 3

# Installing fail2ban is not the same as running it — the packaged default
# enables no jail. roles/common configures the sshd jail explicitly.
fail2ban_max_retry: 5
fail2ban_find_time: 10m
fail2ban_ban_time: 1h
# Addresses fail2ban will never ban. Add your office or home IP so three
# fat-fingered passwords cannot lock you out of your own server.
fail2ban_ignore_ips: []

# ---- Health monitoring -----------------------------------------------------
# Installed by roles/monitoring as a systemd timer.
#
# SCOPE, so this is not mistaken for more than it is: a checker running on the
# server catches the APPLICATION dying. It cannot tell you the machine is gone
# — it would be gone too. Run the same script from a laptop, or point a free
# uptime service at https://<domain>/api/health/live, for that half.
#
# Both URLs are checked and they fail for different reasons: the first goes
# through nginx, so it also catches a broken vhost or a stopped nginx; the
# second hits the API container directly, so a failure there is unambiguously
# the app. /api/health/ready probes Postgres AND Redis and returns 503 when
# either is down, so a 200 means genuinely serving rather than merely
# listening.
health_check_urls:
  - "http://127.0.0.1/api/health/ready"
  - "http://127.0.0.1:{{ api_port }}/api/health/ready"
health_check_interval: 2min
health_check_timeout: 10
# Consecutive failures before alerting. 1 would page on a single dropped
# packet; 2 at a 2-minute interval reports a real outage within ~4 minutes.
health_failure_threshold: 2
health_log_file: /var/log/civitech/health.log

# ---- Semaphore UI ----------------------------------------------------------
semaphore_dir: /opt/semaphore
semaphore_image: "semaphoreui/semaphore:v2.10.34"
semaphore_port: 8888
semaphore_admin_user: admin
# Local account identifier only — Semaphore never sends mail from this box.
# A .local address keeps a real mailbox out of a config file on the server.
semaphore_admin_email: "admin@civitech.local"
semaphore_admin_name: "CiviTech Admin"

# ---- Deploy behaviour ------------------------------------------------------
# deploy.yml takes a database dump before running migrations, because Prisma
# migrations are forward-only: rollback.yml can put the old image back, but
# only that dump can put the data back.
app_pre_deploy_backup: true
