---
# One-time (and safely repeatable) server preparation: packages, the
# application user, firewall, hardened SSH, fail2ban, Docker, and the backup
# tooling.
#
#   ansible-playbook provision.yml --vault-password-file ~/.civitech-vault-pass
#
# Run this before deploy.yml, and again whenever anything in group_vars
# changes the base system.

- name: Provision the CiviTech host
  hosts: civitech_prod
  become: true

  roles:
    - common
    - docker
    # Backup tooling and the nightly cron job are server setup, not
    # deployment. Running it here means a provisioned server is ready to be
    # backed up before the first release ever lands — deploy.yml takes a dump
    # before it migrates, and that must not be the thing that creates the
    # directory.
    - backup
