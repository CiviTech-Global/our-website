---
# Semaphore UI — a web front end for these same playbooks.
#
# It does not replace Ansible. It stores inventories, keys and playbook
# "templates", runs ansible-playbook for you, and keeps the output of every
# run. The value is that a deploy or a restore becomes a form someone can fill
# in from a browser without a WSL shell, and that every run is recorded with
# who ran it and what they chose.
#
# If a playbook does not work from your terminal it will not work here — it
# will just fail more colourfully. Get the CLI path working first.

- name: Ensure Docker is installed
  # Semaphore ships as a container; the application stack needs Docker anyway.
  # On a separate control host this is what provides it.
  ansible.builtin.include_role:
    name: docker

- name: Create the Semaphore directory
  ansible.builtin.file:
    path: "{{ semaphore_dir }}"
    state: directory
    mode: "0750"

- name: Render the Semaphore compose file
  ansible.builtin.template:
    src: semaphore-compose.yml.j2
    dest: "{{ semaphore_dir }}/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Start Semaphore
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ semaphore_dir }}"
  changed_when: true

- name: Wait for Semaphore to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ semaphore_port }}/api/ping"
    status_code: [200, 204]
  register: sem_ping
  until: sem_ping.status in [200, 204]
  retries: 20
  delay: 3

- name: Explain how to reach Semaphore
  # Deliberately NOT opened in the firewall — roles/common's allow list is
  # 22/80/443 and Semaphore is not on it.
  #
  # Semaphore holds the SSH key to this server and the Ansible Vault password.
  # Putting its login form on the public internet makes it the softest target
  # on the box: everything these playbooks harden becomes irrelevant if that
  # form falls. Reach it through a tunnel, or put it behind its own nginx
  # vhost with TLS and IP allow-listing.
  ansible.builtin.debug:
    msg: >-
      Semaphore is listening on 127.0.0.1:{{ semaphore_port }} and is NOT
      exposed publicly. Tunnel to it from your laptop:
      ssh -L {{ semaphore_port }}:127.0.0.1:{{ semaphore_port }}
      {{ ansible_user }}@{{ ansible_host }}
      then open http://localhost:{{ semaphore_port }}
